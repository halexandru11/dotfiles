set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Set the prefix to C-Space
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Open panes in current directory
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Theme configuration
set -g @catppuccin_flavour 'macchiato' # latte | frappe | macchiato | mocha

# Configure left status
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "custom"

set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_blue}]#[bg=#{@thm_blue},fg=#{@thm_bg}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_blue}]█"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_peach}]#[bg=#{@thm_peach},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_peach}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

set -g @catppuccin_window_fill 'number'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text " #W"

# Configure right status
set -g @catppuccin_directory_text "#( echo ' '\#{pane_current_path} | sed \"s|$HOME|~|\" )"
set -g @catppuccin_directory_color "#{@thm_pink}"
set -g @catppuccin_status_connect_separator 'yes'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Set the status line
set-option -g status-position top

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ''
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# List of plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Make the status line have a empty line below it
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[1]' ''
set -g status 2
